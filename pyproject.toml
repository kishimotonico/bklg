[project]
name = "bklg"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "岸本ニコ", email = "kishimotonico@gmail.com" }
]
dependencies = [
    "pydantic>=2.9.2",
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.scripts]
bklg = "bklg.main:app"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bklg"]
