[project]
name = "bacli-py"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "岸本ニコ", email = "kishimotonico@gmail.com" }
]
dependencies = [
    "pydantic>=2.9.2",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.scripts]
hello = "bacli_py:hello"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bacli_py"]
