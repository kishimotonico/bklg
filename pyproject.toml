[project]
name = "bacli-py"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "岸本ニコ", email = "kishimotonico@gmail.com" }
]
dependencies = [
    "pydantic>=2.9.2",
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[project.scripts]
bacli = "bacli_py.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bacli_py"]
